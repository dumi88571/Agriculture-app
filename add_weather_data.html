{% extends "base.html" %}

{% block content %}
<h2>Add Weather Data</h2>

<form method="POST">
    <div class="mb-3">
        <label for="farm_id" class="form-label">Farm</label>
        <select class="form-select" id="farm_id" name="farm_id" required>
            <option value="">Select a farm</option>
            {% for farm in farms %}
            <option value="{{ farm[0] }}">{{ farm[1] }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="mb-3">
        <label for="date" class="form-label">Date</label>
        <input type="date" class="form-control" id="date" name="date" required>
    </div>
    <div class="mb-3">
        <label for="temperature" class="form-label">Temperature (°C)</label>
        <input type="number" class="form-control" id="temperature" name="temperature" step="0.1" required>
    </div>
    <div class="mb-3">
        <label for="humidity" class="form-label">Humidity (%)</label>
        <input type="number" class="form-control" id="humidity" name="humidity" step="0.1" required>
    </div>
    <div class="mb-3">
        <label for="rainfall" class="form-label">Rainfall (mm)</label>
        <input type="number" class="form-control" id="rainfall" name="rainfall" step="0.1" required>
    </div>
    <button type="submit" class="btn btn-success">Add Weather Data</button>
    <a href="{{ url_for('weather_data') }}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
